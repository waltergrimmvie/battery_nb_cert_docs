<body>
  <div id="app">Loading the desk…</div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js", { scope: "/" });
    }
    function start(version) {
      var script = document.createElement("script");
      script.type = "module";
      script.src = "/setup/create_indexed.js?v=" + encodeURIComponent(String(version || "0").trim() || "0");
      document.body.appendChild(script);
    }
    fetch("/version.txt", { cache: "no-store" }).then(function (response) {
      return response.ok ? response.text() : "0";
    }).then(start).catch(function () { start("0"); });
  </script>
</body>
